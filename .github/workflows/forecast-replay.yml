# 事前預測的歷史重播（參考）（F 票；本人 2026-11-17「要，重播當參考」，ANALYSIS_PLAN.md〈事前預測加做「歷史重播」〉）。
# 拿模型知識截止日之後的過去交易日，照正式的方法重寫晚間版與晨間版，成績分開存、分開顯示，不計入正式結論。
# 邊界：
# - 手動觸發預設只算「可以重播幾天、要用幾次 Gemini、缺哪些日子」（plan_only），不呼叫模型。
#   平日台北 10:00 的排程只有 MARKET_ANA_REPLAY_SCHEDULE=on 才真的寫（本人 11-17「今天開跑」）。
# - 真的跑要先回報本人、本人同意後由 owner 從預設分支觸發；每次最多寫 max_forecasts 份，模型一失敗就停
#   （多半是額度用完），免得把 AI Pro 的每週額度用光害正式的晚間／晨間版漏記。下一次從沒寫的日子接著寫。
#   同一天各次加起來最多「每天份數」（repository variable MARKET_ANA_REPLAY_DAILY_LIMIT，沒設用 forecast_replay.DAILY_LIMIT）、
#   只在台北 09:30～15:30 寫（程式擋），避開 07:20 晨間版與收盤後的晚間版。
# - 自動排程的開關是 repository variable MARKET_ANA_REPLAY_SCHEDULE（本人 11-17 同意開跑後由 owner 打開，跑完關掉）；
#   手動觸發照舊只認預設分支。
# - 自己的鎖，不用三支既有排程共用的 market-state-write；只讀工作集，不上傳工作集，不碰正式帳本。
#   重播帳本放 R2 的 forecast-replay/ 前綴（只新增）；網站資料庫寫進重播專用的三張表。
name: forecast-replay

on:
  # 本人 2026-11-17「今天開跑」：之後每個交易日台北 10:00 自動跑一次（同一天的份數上限照「每天份數」），
  # 只有 repository variable MARKET_ANA_REPLAY_SCHEDULE=on 才真的寫；110 天跑完就把它關掉。
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      start:
        description: "重播起日 YYYY-MM-DD（模型知識截止日以前、缺籌碼、方法稿已寫了結果的日子會自動略過）"
        required: true
        type: string
        default: "2026-04-01"
      end:
        description: "重播迄日 YYYY-MM-DD（本人定的上限是 09-08，填得再晚也不會超過）"
        required: true
        type: string
        default: "2026-09-08"
      max_forecasts:
        description: "這一次最多新寫幾份（早晚各算一份；留空＝每天份數；同一天各次加起來不超過每天份數）"
        required: false
        type: string
        default: ""
      plan_only:
        description: "只算可以重播的日子與 Gemini 次數，不呼叫模型"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # 重播自己的鎖：同一時間只有一個重播在寫重播帳本；不擋也不被正式的預測排程擋。
  group: forecast-replay
  cancel-in-progress: false

jobs:
  replay:
    # 開關沒開時排程整個跳過（不還原、不補抓）。11-18 那次排程開關是 off 卻照樣補抓，期交所回錯就整次失敗。
    if: github.event_name != 'schedule' || vars.MARKET_ANA_REPLAY_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      LEDGER: ${{ github.workspace }}/.forecast-replay
    defaults:
      run:
        # 明寫 bash：GitHub 才會加 pipefail，管線前面的程式失敗不會被 tee 蓋掉。
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 決定執行模式並檢查機密
        id: mode
        env:
          INPUT_START: ${{ inputs.start || '2026-04-01' }}
          INPUT_END: ${{ inputs.end || '2026-09-08' }}
          INPUT_MAX: ${{ inputs.max_forecasts }}
          # 每天重播幾份（owner 11-19：量完正式工作的 Argon 用量再填）；沒設就用 forecast_replay.DAILY_LIMIT。
          DAILY_LIMIT: ${{ vars.MARKET_ANA_REPLAY_DAILY_LIMIT }}
          INPUT_PLAN_ONLY: ${{ inputs.plan_only }}
          EVENT_NAME: ${{ github.event_name }}
          REPLAY_SCHEDULE: ${{ vars.MARKET_ANA_REPLAY_SCHEDULE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
        run: |
          for value in "$INPUT_START" "$INPUT_END"; do
            python -c 'from state_sync import require_iso_date; import sys; require_iso_date(sys.argv[1], "workflow date")' "$value" || { echo "::error::日期必須是真實的 YYYY-MM-DD"; exit 1; }
          done
          # 兩個都可以留空：每天份數沒設就由程式用 forecast_replay.DAILY_LIMIT；這一次的份數沒填就只受每天份數限制。
          if [ -n "$DAILY_LIMIT" ] && { ! [[ "$DAILY_LIMIT" =~ ^[0-9]{1,3}$ ]] || [ "$DAILY_LIMIT" -lt 1 ]; }; then echo "::error::MARKET_ANA_REPLAY_DAILY_LIMIT 必須是 1 到 999"; exit 1; fi
          if [ -n "$INPUT_MAX" ] && { ! [[ "$INPUT_MAX" =~ ^[0-9]{1,3}$ ]] || [ "$INPUT_MAX" -lt 1 ]; }; then echo "::error::max_forecasts 必須是 1 到 999"; exit 1; fi
          plan_only=true
          # 真的跑只能用預設分支的程式；其他情況一律只算天數。
          if [ "$INPUT_PLAN_ONLY" = "false" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then plan_only=false; fi
          # 排程：走到這裡一定是開關打開（沒開時整個工作在上面就跳過了），真的寫；排程本來就跑預設分支。
          if [ "$EVENT_NAME" = "schedule" ] && [ "$REPLAY_SCHEDULE" = "on" ]; then plan_only=false; fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY AGY_LOGIN_BUNDLE; do
            if [ -z "${!name}" ]; then echo "::error::缺少 secret $name"; exit 1; fi
          done
          {
            echo "plan_only=$plan_only"
            echo "start=$INPUT_START"
            echo "end=$INPUT_END"
            echo "max_forecasts=$INPUT_MAX"
            echo "daily_limit=$DAILY_LIMIT"
          } >> "$GITHUB_OUTPUT"

      - name: 從 R2 還原每日更新已發布的資料與重播帳本（唯讀）
        id: restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: market-ana-state
        run: |
          python state_sync.py restore --target .
          python forecast_store.py pull --ledger "$LEDGER" --prefix forecast-replay/

      # 本人選 A2：資料包只留 120 天法人與期貨，04-01 起缺的向證交所／期交所補抓（官方公開資料，每次間隔 3 秒）。
      # 原件放進重播帳本的 chips-backfill/，真的跑時跟著重播帳本存回 R2；已經有的不再抓。
      - name: 補抓重播要的法人與期貨原件
        env:
          START: ${{ steps.mode.outputs.start }}
        run: |
          python forecast_replay_chips.py fetch --analysis data/daily-update-state/last-market-pack/analysis-data.js \
            --start "$START" --out "$LEDGER/chips-backfill"

      - name: 算可重播的日子（不呼叫模型）
        env:
          START: ${{ steps.mode.outputs.start }}
          END: ${{ steps.mode.outputs.end }}
          DAILY_LIMIT: ${{ steps.mode.outputs.daily_limit }}
        run: |
          mkdir -p "$RUNNER_TEMP/forecast-replay"
          limit=(); if [ -n "$DAILY_LIMIT" ]; then limit=(--daily-limit "$DAILY_LIMIT"); fi
          python forecast_replay.py --plan --analysis data/daily-update-state/last-market-pack/analysis-data.js \
            --method MARKET_METHOD.md --start "$START" --end "$END" --ledger "$LEDGER" "${limit[@]}" \
            | tee "$RUNNER_TEMP/forecast-replay/plan.json"
          { echo "### 歷史重播：可以重播的日子"; echo '```json'; cat "$RUNNER_TEMP/forecast-replay/plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 海外原件：EODHD 每個代號一次就給齊約一年（共 4 次額度）；美債要涵蓋重播整段的月份檔。
      - name: 抓海外原件（不擋重播）
        if: steps.mode.outputs.plan_only == 'false'
        continue-on-error: true
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          START: ${{ steps.mode.outputs.start }}
        run: |
          months=$(python -c 'import sys; from datetime import date; s=date.fromisoformat(sys.argv[1]); t=date.today(); print((t.year-s.year)*12+t.month-s.month+4)' "$START")
          python overseas_inputs.py fetch --analysis data/daily-update-state/last-market-pack/analysis-data.js \
            --out "$RUNNER_TEMP/overseas" --treasury-months "$months"

      - name: 下載官方 agy 1.5.3 並核對 SHA-256
        id: agy_download
        if: steps.mode.outputs.plan_only == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/agy" && cd "$RUNNER_TEMP/agy"
          curl -fsSL -o agy.tgz https://github.com/google-antigravity/antigravity-cli/releases/download/1.5.3/agy_cli_linux_x64.tar.gz
          echo "1b4850599cce73a17f94ffb422df3bf9531531b77dbddc40c1a435e0c2c16807  agy.tgz" | sha256sum -c
          tar xzf agy.tgz
          ./antigravity --version

      - name: 還原登入檔到隔離 HOME
        if: steps.mode.outputs.plan_only == 'false'
        env:
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
        run: |
          home="$RUNNER_TEMP/agy-home"; mkdir -p "$home"; chmod 700 "$home"
          printf '%s' "$AGY_LOGIN_BUNDLE" | tr -d ' \r\n' | base64 -d | tar xzf - -C "$home"

      - name: 重播並對帳
        if: steps.mode.outputs.plan_only == 'false'
        env:
          HOME: ${{ runner.temp }}/agy-home
          START: ${{ steps.mode.outputs.start }}
          END: ${{ steps.mode.outputs.end }}
          MAX_FORECASTS: ${{ steps.mode.outputs.max_forecasts }}
          DAILY_LIMIT: ${{ steps.mode.outputs.daily_limit }}
        run: |
          # 正式的預測缺一項海外資料照樣寫；重播整批都缺就不是同一套輸入，成績不能和正式比，所以不跑。
          if [ ! -f "$RUNNER_TEMP/overseas/manifest.json" ]; then echo "::error::海外原件沒抓到，這次不重播"; exit 1; fi
          python -c 'import json, sys; bad = [s["name"] for s in json.load(open(sys.argv[1], encoding="utf-8"))["sources"] if s["status"] != "ok"]; print("::error::這些海外原件沒抓到，這次不重播：" + "、".join(bad)) if bad else None; sys.exit(1 if bad else 0)' "$RUNNER_TEMP/overseas/manifest.json"
          limits=()
          if [ -n "$MAX_FORECASTS" ]; then limits+=(--max-forecasts "$MAX_FORECASTS"); fi
          if [ -n "$DAILY_LIMIT" ]; then limits+=(--daily-limit "$DAILY_LIMIT"); fi
          python forecast_replay.py --analysis data/daily-update-state/last-market-pack/analysis-data.js \
            --method MARKET_METHOD.md --start "$START" --end "$END" \
            --ledger "$LEDGER" --agy-bin "$RUNNER_TEMP/agy/antigravity" --fetched-at "$(date -Iseconds)" \
            "${limits[@]}" --overseas-dir "$RUNNER_TEMP/overseas" \
            --sql-output "$RUNNER_TEMP/forecast-replay.sql" --log-output "$LEDGER/runs/$GITHUB_RUN_ID.json"
          cp "$LEDGER/runs/$GITHUB_RUN_ID.json" "$RUNNER_TEMP/forecast-replay/run.json"

      - name: 重播帳本存回 R2（只新增）
        # 重播那一步就算之後出錯，已鎖定的原件也要存回，否則下一次會重寫一份不同的。
        if: always() && steps.mode.outputs.plan_only == 'false' && steps.restore.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: market-ana-state
        run: |
          for attempt in 1 2 3; do
            if python forecast_store.py push --ledger "$LEDGER" --prefix forecast-replay/; then exit 0; fi
            echo "::warning::存回 R2 第 $attempt 次失敗"; sleep 20
          done
          echo "::error::重播帳本三次都沒能存回 R2"; exit 1

      - name: 發布到網站資料庫（重播專用的表）
        if: success() && steps.mode.outputs.plan_only == 'false'
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -s "$RUNNER_TEMP/forecast-replay.sql" ]; then echo "::notice::沒有要發布的紀錄"; exit 0; fi
          npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/forecast-replay.sql"

      - name: 執行摘要
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/forecast-replay/run.json" ]; then
            { echo "### 歷史重播（參考）這一次"; echo '```json'; cat "$RUNNER_TEMP/forecast-replay/run.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 保存執行紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/forecast-replay/
          retention-days: 90
          if-no-files-found: warn

      - name: 記下 Gemini 剩餘用量（設定頁用；失敗不影響這支排程）
        # agy -p /usage 由 CLI 自己回答、不耗額度；讀不到也記下這次跑過（gemini_usage.py）。只有站主在設定頁看得到。
        if: always() && steps.mode.outputs.plan_only == 'false'
        continue-on-error: true
        env:
          HOME: ${{ runner.temp }}/agy-home
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python gemini_usage.py --agy-bin "$RUNNER_TEMP/agy/antigravity" --task forecast-replay --run-id "$GITHUB_RUN_ID" \
            --sql-output "$RUNNER_TEMP/gemini-usage.sql"
          cd cloud && npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/gemini-usage.sql"

      - name: 清除登入檔與暫存
        if: always()
        run: rm -rf "$RUNNER_TEMP/agy-home" "$RUNNER_TEMP/agy" "$RUNNER_TEMP/forecast-replay.sql" "$RUNNER_TEMP/overseas" "$RUNNER_TEMP/gemini-usage.sql"
