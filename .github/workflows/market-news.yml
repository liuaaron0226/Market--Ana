# 首頁「消息」（本人 2026-11-19「共識達成」，.scratch/market-news/consensus.md）：交易日三輪抓市場新聞與個股新聞，
# 站主的模型（設定頁 AI 模型「首頁消息」，預設 Flash 高）一次標利多／利空、翻中文、寫「今天為什麼這樣走」；
# 有 Gemini 金鑰的朋友，他自選股的新聞用他自己的金鑰各判一次。結果寫進網站資料庫（market_news_*、watch_news）。
# 觸發：
# - 盤前 08:00：公司重大訊息（announcements，cron-trigger 每天台北 08:00）跑完接著跑；週末不跑。
# - 午盤 11:30、收盤後 14:00：cron-trigger（worker.js 的 "30 3"、"0 6"）以 workflow_dispatch 觸發、帶 slot。
# - 加開三班（本人 2026-11-24，.scratch/market-news-night 票 01）：盤後 18:30（evening）、美股開盤 23:00（us_open）、
#   美股收盤 06:30（us_close，台北週二到週六），也由 cron-trigger 觸發（"30 10"、"0 15"、"30 22"）。這三班 Google News 搜尋量壓低
#   （11-23 被 429 限流過）、盤勢解讀不跟著跑；美股那兩班不看台股休市。要先套資料庫的 0037，沒套時這三班安靜跳過。
# 正式寫入要 repository variable MARKET_ANA_MARKET_NEWS_SCHEDULE=on 而且是預設分支；其他一律乾跑：
# 照樣抓、照樣叫站主的模型（記用量），但不寫網站資料庫、不叫朋友的金鑰。網站顯示另有 MARKET_ANA_MARKET_NEWS 開關。
# 重大消息推播（影響大的那幾則送到站主的裝置）另有開關：repository variable MARKET_ANA_MARKET_NEWS_PUSH 要剛好是 on。
name: market-news

on:
  workflow_run:
    workflows: [announcements]
    types: [completed]
  workflow_dispatch:
    inputs:
      slot:
        description: "哪一輪：us_close 美股收盤 06:30／morning 盤前／midday 午盤／close 收盤後／evening 盤後 18:30／us_open 美股開盤 23:00"
        required: true
        type: choice
        options: [us_close, morning, midday, close, evening, us_open]
        default: close
      dry_run:
        description: "乾跑：照樣抓、叫站主的模型，但不寫網站資料庫"
        required: false
        type: boolean
        default: true
      date:
        description: "cron-trigger 送的台北日期（只做紀錄；一律取台北今天）"
        required: false
        type: string
      trigger_source:
        description: "自動排程來源（cloudflare-cron）；手動留空"
        required: false
        type: string
      trigger_slot:
        description: "原始 UTC cron 時段"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false && format('market-news-dry-{0}', github.run_id) || 'market-news' }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
      dry_run: ${{ steps.auth.outputs.dry_run }}
      slot: ${{ steps.auth.outputs.slot }}
    steps:
      - name: Fail-closed 核准執行模式
        id: auth
        env:
          EVENT_NAME: ${{ github.event_name }}
          SWITCH: ${{ vars.MARKET_ANA_MARKET_NEWS_SCHEDULE }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SLOT: ${{ inputs.slot }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          on_main=false
          if [ "$SWITCH" = "on" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then on_main=true; fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            dry_run=true
            if [ "$INPUT_DRY_RUN" = "false" ] && [ "$on_main" = "true" ]; then dry_run=false; fi
            echo "allowed=true" >> "$GITHUB_OUTPUT"; echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
            echo "slot=$INPUT_SLOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 接在公司重大訊息後面的盤前那一輪：台北週六、週日不跑；手動重跑公告（台北 07:30～10:00 以外）不跟著跑；
          # 開關沒開就什麼都不做。休市日由 market_news.py --skip-closed 依證交所休市日曆判斷。
          weekday=$(TZ=Asia/Taipei date +%u)
          minute=$(( 10#$(TZ=Asia/Taipei date +%H) * 60 + 10#$(TZ=Asia/Taipei date +%M) ))
          if [ "$on_main" = "true" ] && [ "$weekday" -le 5 ] && [ "$minute" -ge 450 ] && [ "$minute" -le 600 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"; echo "dry_run=false" >> "$GITHUB_OUTPUT"; echo "slot=morning" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MARKET_ANA_MARKET_NEWS_SCHEDULE 不是 on、今天是週末，或不在台北早上，盤前那一輪不執行"
          fi

  news:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 第一次回補個股新聞時搜尋與判讀都比較多
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      DRY_RUN: ${{ needs.authorize.outputs.dry_run }}
      SLOT: ${{ needs.authorize.outputs.slot }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安裝相依
        run: python -m pip install -r requirements-daily.txt

      - name: 檢查機密
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID AGY_LOGIN_BUNDLE OWNER_EMAIL; do
            if [ -z "${!name}" ]; then echo "::error::缺少 $name"; exit 1; fi
          done

      - name: 讀設定頁的 AI 模型（讀不到照 gemini_models.py 的預設跑）
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (cd cloud && npx --yes wrangler@4 d1 execute market-ana-accounts --remote --json \
            --command "SELECT task, model, effort FROM ai_model_settings" > "$RUNNER_TEMP/ai-models.json") \
            || echo "::warning::讀不到設定頁的 AI 模型設定"
          python gemini_settings.py --input "$RUNNER_TEMP/ai-models.json" --github-env "$GITHUB_ENV" \
            --task market-news --run-id "$GITHUB_RUN_ID" --read-sql "$RUNNER_TEMP/ai-model-read.sql"

      - name: 下載官方 agy 1.5.3 並核對 SHA-256
        id: agy_download
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/agy" && cd "$RUNNER_TEMP/agy"
          curl -fsSL -o agy.tgz https://github.com/google-antigravity/antigravity-cli/releases/download/1.5.3/agy_cli_linux_x64.tar.gz
          echo "1b4850599cce73a17f94ffb422df3bf9531531b77dbddc40c1a435e0c2c16807  agy.tgz" | sha256sum -c
          tar xzf agy.tgz
          ./antigravity --version

      - name: 還原登入檔到隔離 HOME
        id: agy_auth
        if: steps.agy_download.outcome == 'success'
        continue-on-error: true
        env:
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
        run: |
          home="$RUNNER_TEMP/agy-home"; mkdir -p "$home"; chmod 700 "$home"
          printf '%s' "$AGY_LOGIN_BUNDLE" | tr -d ' \r\n' | base64 -d | tar xzf - -C "$home"

      # 「我的自選」要用最新的個股新聞：先抓一次（股票池前 50、每個人的自選與最近搜尋；Google News 大媒體＋中央社）。
      # 乾跑不寫網站資料庫，所以跳過（模型讀的是資料庫裡現有的個股新聞）。
      - name: 個股新聞：抓 Google News 大媒體與中央社，寫進 D1
        if: env.DRY_RUN == 'false'
        continue-on-error: true
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 加開的三班（盤後、美股開盤、美股收盤）搜尋量壓到白天的三分之一（watch_news.NIGHT_MAX_QUERIES）：11-23 被 Google News 限流過。
          # 被限流（429／503）時這一步只是少抓，中央社與重大訊息照常；這一步失敗也不擋後面的消息。
          case "$SLOT" in
            evening|us_open|us_close) python watch_news.py daily --d1 --night ;;
            *) python watch_news.py daily --d1 ;;
          esac

      - name: 讀可用的朋友金鑰（密文；朋友 AI 解讀開著才讀）
        if: env.DRY_RUN == 'false' && vars.MARKET_ANA_FRIEND_AI == 'on'
        continue-on-error: true
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute market-ana-accounts --remote --json \
            --command "$(node friend-ai-schedule.mjs keys-sql)" > "$RUNNER_TEMP/friend-keys.json"

      - name: 一輪首頁消息
        id: news
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          FRIEND_AI_MASTER_KEY: ${{ secrets.FRIEND_AI_MASTER_KEY }}
          AI_NEWS_MODEL: ${{ env.AI_NEWS_MODEL }}
          AI_NEWS_EFFORT: ${{ env.AI_NEWS_EFFORT }}
        run: |
          args=(run --slot "$SLOT" --skip-closed --agy-bin "$RUNNER_TEMP/agy/antigravity" --agy-home "$RUNNER_TEMP/agy-home")
          if [ "$DRY_RUN" = "false" ]; then
            args+=(--friend-keys "$RUNNER_TEMP/friend-keys.json")
          else
            args+=(--dry-run)
          fi
          mkdir -p "$RUNNER_TEMP/market-news"
          # 沒有 pipefail 時，market_news.py 失敗（例如資料庫寫不進去）會被後面的 tee 蓋成成功（2026-11-24 第二意見審查）。
          set -o pipefail
          # 倉庫公開之後這裡的輸出與步驟摘要誰都看得到：market_news.py 印的是遮過的那一份（public_log.py：朋友的 email、
          # 站主個股的盯項、模型回的字都不印）。這支排程沒有存回 R2 的資料夾，所以完整的報告不另外保存（--private-report 沒給）。
          python market_news.py "${args[@]}" | tee "$RUNNER_TEMP/market-news/run.json"

      # 重大消息推播（本人 2026-11-24，.scratch/market-news-night 票 01）：這一班寫進資料庫之後，把判成影響大（impact 3）的消息
      # 送到站主的裝置（六班都送）。同一則只送一次、跨班也不重複，一班最多三則（cloud/lib/market-news-push.js；要資料庫的 0037）。
      # 開關是 repository variable MARKET_ANA_MARKET_NEWS_PUSH（要剛好是 on）；乾跑、消息那一步失敗、休市或跳過都不送。
      # 金鑰沿用關注與追蹤事項推播放在 GitHub 的那一組。送不成不影響這一班（continue-on-error，指令本身也一律以 0 結束）。
      # 倉庫公開：這一步印的只有數字（送了幾則、幾則重複），不印標題、裝置網址或信箱。
      - name: 重大消息推播（只送站主；失敗不影響這一輪）
        if: success() && env.DRY_RUN == 'false' && vars.MARKET_ANA_MARKET_NEWS_PUSH == 'on'
        continue-on-error: true
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          run_id=$(python -c "import json,sys; r=json.loads(open(sys.argv[1], encoding='utf-8').read().strip().splitlines()[-1]); print(r.get('run_id') if r.get('status') == 'ok' else '')" "$RUNNER_TEMP/market-news/run.json" || true)
          if [ -z "$run_id" ]; then echo "這一班消息沒有寫進資料庫（休市或沒跑成），不推播"; exit 0; fi
          MARKET_NEWS_RUN_ID="$run_id" node cloud/market-news-push.mjs || echo "::warning::重大消息推播沒有送成"

      - name: 記進 Gemini 用量（設定頁用；失敗不影響這一輪）
        if: always() && steps.agy_auth.outcome == 'success'
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/agy-home"
          python gemini_usage.py --agy-bin "$RUNNER_TEMP/agy/antigravity" --task market-news --run-id "$GITHUB_RUN_ID" \
            --sql-output "$RUNNER_TEMP/gemini-usage.sql"
          if [ -s "$RUNNER_TEMP/gemini-usage.sql" ]; then
            cd cloud
            npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/gemini-usage.sql"
            npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/ai-model-read.sql" \
              || echo "::warning::這一班讀設定的結果寫不進去"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 盤勢解讀白天三班（本人 2026-11-23「共識達成」，.scratch/market-brief 票 06）：接在這一班消息成功寫進資料庫之後，
      # 用最近一次大盤資料包的籌碼與位置（白天是前一交易日）＋國際股市六個指數＋這一班消息，寫一份分類別的解讀，
      # 存進 D1 market_brief_runs（時段 morning／midday／close；18:00 那一班在 daily-update.yml）。
      # 排程開關是 repository variable MARKET_ANA_MARKET_BRIEF_SCHEDULE（要剛好是 on）；乾跑不跑；消息那一步失敗、
      # 或台股休市（消息印 skipped）也不跑，網站留上一班。五步都 continue-on-error：寫不成不影響這一輪消息。
      # 大盤資料包從 R2 的工作集唯讀取回（只取 last-market-pack 一項）；這支排程不上傳、不同步任何狀態。
      # 模型與思考程度沿用設定頁「AI 模型」的白話分析那一項（前面讀設定那一步寫進環境的 AI_PLAIN_*）。
      # 只跟原本三班（morning／midday／close）：加開的盤後、美股開盤、美股收盤三班不跑盤勢解讀（維持一天四次）——
      # 取資料包那一步多一個時段條件，它不跑、ready 就不會是 true，後面四步跟著不跑。
      # 倉庫公開：這幾步印的只有遮過的報告（狀態、時段、來源、類別、模型），模型寫的句子只在 --report 那一份
      # （跟著這台機器一起消失，不進 artifact、不進步驟摘要）。
      - name: 盤勢解讀：取回最近一次大盤資料包（R2，唯讀）
        id: brief_pack
        if: success() && env.DRY_RUN == 'false' && vars.MARKET_ANA_MARKET_BRIEF_SCHEDULE == 'on' && (env.SLOT == 'morning' || env.SLOT == 'midday' || env.SLOT == 'close')
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: market-ana-state
        run: |
          ran=$(python -c "import json,sys; print(json.loads(open(sys.argv[1], encoding='utf-8').read().strip().splitlines()[-1]).get('status'))" "$RUNNER_TEMP/market-news/run.json")
          if [ "$ran" != "ok" ]; then echo "這一班消息沒有寫進資料庫（休市或沒跑成），盤勢解讀不跑"; exit 0; fi
          python state_sync.py restore --target . --only data/daily-update-state/last-market-pack
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 盤勢解讀：讀國際股市與這一班消息（D1，唯讀）
        if: success() && env.DRY_RUN == 'false' && vars.MARKET_ANA_MARKET_BRIEF_SCHEDULE == 'on' && steps.brief_pack.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          query="$(python market_brief.py inputs-sql --slot "$SLOT")"
          (cd cloud && npx --yes wrangler@4 d1 execute market-ana-accounts --remote --json \
            --command "$query" > "$RUNNER_TEMP/market-brief-inputs.json") \
            || echo "::warning::讀不到國際股市與這一班消息，盤勢解讀那兩類這一班各只有一句"

      - name: 盤勢解讀：產生這一班（接在消息成功之後）
        id: market_brief
        if: success() && env.DRY_RUN == 'false' && vars.MARKET_ANA_MARKET_BRIEF_SCHEDULE == 'on' && steps.brief_pack.outputs.ready == 'true'
        continue-on-error: true
        run: |
          # 模型與思考程度：market_brief.py 自己讀環境裡的 AI_PLAIN_*，這裡不另外帶
          set -o pipefail
          python market_brief.py run --slot "$SLOT" --analysis data/daily-update-state/last-market-pack/analysis-data.js \
            --inputs "$RUNNER_TEMP/market-brief-inputs.json" \
            --agy-bin "$RUNNER_TEMP/agy/antigravity" --agy-home "$RUNNER_TEMP/agy-home" \
            --sql-output "$RUNNER_TEMP/market-brief.sql" \
            --report "data/daily-update-log/market-brief/$(date +%F)-$SLOT.json" | tee "$RUNNER_TEMP/market-brief.json"

      - name: 盤勢解讀：寫進 D1（失敗不影響這一輪消息）
        if: success() && env.DRY_RUN == 'false' && vars.MARKET_ANA_MARKET_BRIEF_SCHEDULE == 'on' && steps.brief_pack.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -s "$RUNNER_TEMP/market-brief.sql" ]; then
            cd cloud
            npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/market-brief.sql"
          else
            echo "這一班沒有要寫的盤勢解讀"
          fi

      # 設定頁的 Gemini 用量：這一班有呼叫到模型就記一筆（任務名稱 market-brief；一天最多四筆：白天三班＋18:00）。
      - name: 盤勢解讀：記進 Gemini 用量（設定頁用；失敗不影響這一輪消息）
        if: success() && env.DRY_RUN == 'false' && vars.MARKET_ANA_MARKET_BRIEF_SCHEDULE == 'on' && steps.brief_pack.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export HOME="$RUNNER_TEMP/agy-home"
          python market_brief.py usage --report "$RUNNER_TEMP/market-brief.json" --run-id "$GITHUB_RUN_ID" \
            --agy-bin "$RUNNER_TEMP/agy/antigravity" --sql-output "$RUNNER_TEMP/market-brief-usage.sql"
          if [ -s "$RUNNER_TEMP/market-brief-usage.sql" ]; then
            cd cloud
            npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/market-brief-usage.sql"
          fi

      - name: 執行摘要
        if: always()
        run: |
          {
            echo "### 首頁消息 $SLOT（${{ env.DRY_RUN == 'false' && '正式' || '乾跑，未寫入' }}）"
            if [ -f "$RUNNER_TEMP/market-news/run.json" ]; then echo '```json'; cat "$RUNNER_TEMP/market-news/run.json"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清除 agy 登入檔、朋友金鑰密文與暫存
