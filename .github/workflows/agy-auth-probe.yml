# G4 實驗：驗證官方 Antigravity CLI（agy -p）能不能在全新的 GitHub runner 上，
# 用本人存進 secret 的登入檔跑起來（CI 用途，官方 FAQ：direct scripting and CI workflows）。
# - 只能手動觸發；不碰網站資料，不帶 Cloudflare／R2 金鑰。
# - 登入檔只寫進 runner 暫存的隔離 HOME，結束時清掉；不印內容、不上傳 artifact、不用 cache。
# 設計與風險：.scratch/g4-gemini-runner/CI-AUTH.md
# 2026-11-17 換 Argon（gemini_models.py）：加上列模型與額度（/usage，本機 1.5.9 實測不呼叫模型）兩步。
# 上線前用 model=gemini-4-argon 觸發一次，確認 runner 上的 1.5.3 認得 Argon、/usage 一樣不花額度（num_turns 0）。
name: agy-auth-probe

on:
  workflow_dispatch:
    inputs:
      model:
        description: 最小呼叫用的模型（換 Argon 前填 gemini-4-argon 核對一次；只呼叫一次）
        required: false
        default: gemini-3.8-flash-low

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 此手動探測不讀 R2：驗證最新官方 CLI；正式排程則讀模型目錄同一快照。
      - name: 下載最新官方 agy 並核對官方 SHA-256
        run: python gemini_runtime.py probe-install --directory "$RUNNER_TEMP/agy"

      - name: 還原登入檔到隔離 HOME
        env:
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
        run: |
          if [ -z "$AGY_LOGIN_BUNDLE" ]; then echo "::error::缺少 secret AGY_LOGIN_BUNDLE"; exit 1; fi
          home="$RUNNER_TEMP/agy-home"; mkdir -p "$home"; chmod 700 "$home"
          printf '%s' "$AGY_LOGIN_BUNDLE" | tr -d ' \r\n' | base64 -d | tar xzf - -C "$home"
          # 倉庫公開之後這裡的輸出誰都看得到：登入檔的路徑、帳號的模型清單、額度的內容、模型的回答都不印，只印成功與否和數量。
          echo "還原的檔案：$(find "$home" -type f | wc -l) 個"

      - name: 列出這個帳號可用的模型（不呼叫模型；只印幾行、有沒有這次要用的模型）
        env:
          MODEL: ${{ inputs.model || 'gemini-3.8-flash-low' }}
        run: |
          if HOME="$RUNNER_TEMP/agy-home" "$RUNNER_TEMP/agy/antigravity" models > "$RUNNER_TEMP/models.txt" 2>/dev/null; then
            echo "models：成功，$(grep -c . "$RUNNER_TEMP/models.txt" || true) 行"
            if grep -qF -- "$MODEL" "$RUNNER_TEMP/models.txt"; then echo "清單裡有 $MODEL"; else echo "::warning::清單裡沒有 $MODEL"; fi
          else
            echo "::warning::這一版 agy 沒有 models 子指令（或執行失敗）"
          fi

      - name: 額度（呼叫前）
        run: |
          HOME="$RUNNER_TEMP/agy-home" "$RUNNER_TEMP/agy/antigravity" -p /usage --output-format json --print-timeout 60s \
            < /dev/null > "$RUNNER_TEMP/usage.json" 2>/dev/null || true
          python3 -c "import json,sys; t=open(sys.argv[1]).read(); d=json.loads(t[t.find('{'):]) if '{' in t else {}; print('num_turns:', d.get('num_turns'), '| total_tokens:', (d.get('usage') or {}).get('total_tokens'), '| response 字數:', len(d.get('response') or ''))" "$RUNNER_TEMP/usage.json"

      - name: 跑一次最小的 agy -p
        env:
          MODEL: ${{ inputs.model || 'gemini-3.8-flash-low' }}
        run: |
          cd "$RUNNER_TEMP"
          HOME="$RUNNER_TEMP/agy-home" "$RUNNER_TEMP/agy/antigravity" -p "只回答 OK" \
            --model "$MODEL" --output-format json --print-timeout 120s < /dev/null > out.json 2> err.txt || true
          python3 - <<'PY'
          import json, os
          t = open(os.path.join(os.environ["RUNNER_TEMP"], "out.json"), encoding="utf-8", errors="replace").read()
          i = t.find("{")
          d = json.loads(t[i:]) if i >= 0 else {}
          print("status:", d.get("status"), "| finished_reason:", d.get("finished_reason"))
          print("response 字數:", len(d.get("response") or ""))
          if d.get("status") != "SUCCESS":
              raise SystemExit("agy -p 沒有成功")
          PY
          echo "stderr：$(wc -c < err.txt) bytes（內容不印）"

      - name: 額度（呼叫後）
        if: always()
        run: |
          HOME="$RUNNER_TEMP/agy-home" "$RUNNER_TEMP/agy/antigravity" -p /usage --output-format json --print-timeout 60s \
            < /dev/null > "$RUNNER_TEMP/usage.json" 2>/dev/null || true
          python3 -c "import json,sys; t=open(sys.argv[1]).read(); d=json.loads(t[t.find('{'):]) if '{' in t else {}; print('num_turns:', d.get('num_turns'), '| total_tokens:', (d.get('usage') or {}).get('total_tokens'), '| response 字數:', len(d.get('response') or ''))" "$RUNNER_TEMP/usage.json"

      - name: 清除登入檔
        if: always()
        run: rm -rf "$RUNNER_TEMP/agy-home" "$RUNNER_TEMP/out.json" "$RUNNER_TEMP/err.txt" "$RUNNER_TEMP/usage.json" "$RUNNER_TEMP/models.txt"
