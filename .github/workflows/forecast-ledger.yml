# 預測帳本 C 票：每日更新確認正式發布後，寫一份晚間版大盤預測、鎖定、存回 R2、發布到網站資料庫，並對帳。
# 規格：.scratch/forecast-ledger/spec.md（工作目錄，不入版控）。這個階段的紀錄都是試跑。
# 邊界：
# - 自己的鎖（forecast-ledger），不加入三支既有排程共用的 market-state-write；只讀工作集（state_sync restore），
#   不上傳工作集。帳本原件存在 R2 的 forecast-ledger/ 前綴，只新增、不覆寫（forecast_store.py）。
# - 自動觸發要同時有「每日更新正式發布的證據」與 repository variable MARKET_ANA_FORECAST_SCHEDULE=on；
#   沒設就什麼都不寫。手動觸發預設乾跑：用真的 Gemini，但只寫暫存副本、不存 R2、不寫資料庫。
# - 帳本先存回 R2 再寫資料庫：R2 的原件是唯一的事實來源，資料庫只是給網站讀的一份。
name: forecast-ledger

on:
  workflow_run:
    workflows: [daily-update]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "資料日 YYYY-MM-DD（留空＝已發布資料的最後一天；必須等於它，否則不寫）"
        required: false
        type: string
      dry_run:
        description: "乾跑：用真的 Gemini 寫在暫存副本，不存 R2、不寫資料庫"
        required: false
        type: boolean
        default: true
      as_of:
        description: "乾跑時重播已發布過的某一天 YYYY-MM-DD（只在乾跑有效）"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # 預測帳本自己的鎖：寫預測與對帳不會被其他每日排程擠掉或取消，也不擋它們。
  # GitHub 同一組只留一個排隊中的執行；手動乾跑各自一組，才不會把排隊中的正式寫入替換掉。
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false && format('forecast-ledger-dry-{0}', github.run_id) || 'forecast-ledger' }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
      dry_run: ${{ steps.auth.outputs.dry_run }}
      requested_date: ${{ steps.auth.outputs.data_date }}
      head_sha: ${{ steps.auth.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: 下載觸發 run 的正式發布證據
        if: github.event_name == 'workflow_run' && vars.MARKET_ANA_FORECAST_SCHEDULE == 'on'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: daily-publication-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/publication
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail-closed 核准執行模式
        id: auth
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_SWITCH: ${{ vars.MARKET_ANA_FORECAST_SCHEDULE }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 日期會原樣寫進 GITHUB_OUTPUT；夾帶換行就能多塞一行，寫入前先擋。
            if [ -n "$INPUT_DATE" ] && ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::date 必須是 YYYY-MM-DD"; exit 1
            fi
            dry_run=true
            # 手動正式跑要排程開關打開，而且只能用預設分支的程式；其他情況一律乾跑。
            if [ "$INPUT_DRY_RUN" = "false" ] && [ "$SCHEDULE_SWITCH" = "on" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              dry_run=false
            fi
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
            echo "data_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
            echo "head_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE_SWITCH" != "on" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MARKET_ANA_FORECAST_SCHEDULE 不是 on，晚間預測不執行"
          else
            python ai_digest_trigger.py authorize \
              --evidence "$RUNNER_TEMP/publication/daily-publication.json" \
              --expected-run-id "$EXPECTED_RUN_ID" \
              --expected-head-sha "$EXPECTED_HEAD_SHA" \
              --expected-repository "$EXPECTED_REPOSITORY" \
              --expected-branch "$EXPECTED_BRANCH" \
              --conclusion "$UPSTREAM_CONCLUSION" \
              --github-output "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  forecast:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      LEDGER: ${{ github.workspace }}/.forecast-ledger
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 決定執行模式並檢查機密
        id: mode
        env:
          AUTH_DRY_RUN: ${{ needs.authorize.outputs.dry_run }}
          INPUT_DATE: ${{ needs.authorize.outputs.requested_date }}
          INPUT_AS_OF: ${{ inputs.as_of }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
        run: |
          for value in "$INPUT_DATE" "$INPUT_AS_OF"; do
            if [ -n "$value" ]; then
              python -c 'from state_sync import require_iso_date; import sys; require_iso_date(sys.argv[1], "workflow date")' "$value" || { echo "::error::日期必須是真實的 YYYY-MM-DD"; exit 1; }
            fi
          done
          dry_run=true
          if [ "$AUTH_DRY_RUN" = "false" ]; then dry_run=false; fi
          if [ -n "$INPUT_AS_OF" ] && [ "$dry_run" = "false" ]; then echo "::error::as_of 只能用在乾跑"; exit 1; fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY AGY_LOGIN_BUNDLE; do
            if [ -z "${!name}" ]; then echo "::error::缺少 secret $name"; exit 1; fi
          done
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "requested_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          echo "as_of=$INPUT_AS_OF" >> "$GITHUB_OUTPUT"

      - name: 從 R2 還原每日更新已發布的資料（唯讀）
        id: restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: market-ana-state
        run: |
          python state_sync.py restore --target .
          python forecast_store.py pull --ledger "$LEDGER"

      # D 票：美日韓指數、美債、美元指數、美元兌台幣的原件。抓不到的項目在預測裡標明缺漏，不擋預測。
      # EODHD 那幾檔走共用快取（R2 eodhd-cache/，G 票延伸 2026-11-17）：和關注的國外同類股同一份，同一個收盤之後只抓一次。
      - name: 抓海外原件（不擋預測）
        continue-on-error: true
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: market-ana-state
          AS_OF: ${{ steps.mode.outputs.as_of }}
        run: |
          if [ -n "$AS_OF" ]; then ref=(--reference-date "$AS_OF"); else ref=(--analysis data/daily-update-state/last-market-pack/analysis-data.js); fi
          python overseas_inputs.py fetch "${ref[@]}" --out "$RUNNER_TEMP/overseas" --shared-cache

      - name: 下載官方 agy 1.5.3 並核對 SHA-256
        id: agy_download
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/agy" && cd "$RUNNER_TEMP/agy"
          curl -fsSL -o agy.tgz https://github.com/google-antigravity/antigravity-cli/releases/download/1.5.3/agy_cli_linux_x64.tar.gz
          echo "1b4850599cce73a17f94ffb422df3bf9531531b77dbddc40c1a435e0c2c16807  agy.tgz" | sha256sum -c
          tar xzf agy.tgz
          ./antigravity --version

      - name: 還原登入檔到隔離 HOME
        id: agy_auth
        if: steps.agy_download.outcome == 'success'
        continue-on-error: true
        env:
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
        run: |
          home="$RUNNER_TEMP/agy-home"; mkdir -p "$home"; chmod 700 "$home"
          printf '%s' "$AGY_LOGIN_BUNDLE" | tr -d ' \r\n' | base64 -d | tar xzf - -C "$home"

      - name: 寫晚間版預測並對帳
        env:
          HOME: ${{ runner.temp }}/agy-home
          REQUESTED_DATE: ${{ steps.mode.outputs.requested_date }}
          AS_OF: ${{ steps.mode.outputs.as_of }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          # agy 沒裝好時照樣交給帳本：模型呼叫失敗會記成一筆漏記（原因看得到），不靜默跳過。
          args=(--analysis data/daily-update-state/last-market-pack/analysis-data.js --method MARKET_METHOD.md
                --ledger "$LEDGER" --agy-bin "$RUNNER_TEMP/agy/antigravity" --model gemini-3.8-flash
                --overseas-dir "$RUNNER_TEMP/overseas")
          if [ -n "$REQUESTED_DATE" ]; then args+=(--date "$REQUESTED_DATE"); fi
          if [ "$DRY_RUN" = "false" ]; then
            # 每一次正式執行的紀錄放進帳本（runs/），跟著帳本存回 R2。
            args+=(--sql-output "$RUNNER_TEMP/forecast.sql" --log-output "$LEDGER/runs/$GITHUB_RUN_ID.json")
          else
            args+=(--dry-run --log-output "$RUNNER_TEMP/forecast-run/run.json")
            if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          fi
          python forecast_run.py "${args[@]}"
          mkdir -p "$RUNNER_TEMP/forecast-run"
          if [ -f "$LEDGER/runs/$GITHUB_RUN_ID.json" ]; then cp "$LEDGER/runs/$GITHUB_RUN_ID.json" "$RUNNER_TEMP/forecast-run/run.json"; fi

      - name: 帳本原件存回 R2（只新增）
        # 寫預測那一步就算之後出錯，本機已鎖定的原件也要存回，否則重跑會換掉第一份；只要帳本是從 R2 還原成功的就存。
        if: always() && steps.mode.outputs.dry_run == 'false' && steps.restore.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: market-ana-state
        run: |
          for attempt in 1 2 3; do
            if python forecast_store.py push --ledger "$LEDGER"; then exit 0; fi
            echo "::warning::存回 R2 第 $attempt 次失敗"; sleep 20
          done
          echo "::error::帳本原件三次都沒能存回 R2"; exit 1

      - name: 發布到網站資料庫
        if: success() && steps.mode.outputs.dry_run == 'false'
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -s "$RUNNER_TEMP/forecast.sql" ]; then echo "::notice::沒有要發布的紀錄"; exit 0; fi
          npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/forecast.sql"

      - name: 執行摘要
        if: always()
        run: |
          {
            echo "### 晚間版大盤預測（${{ steps.mode.outputs.dry_run == 'false' && '試跑紀錄' || '乾跑或未寫入' }}）"
            if [ -f "$RUNNER_TEMP/forecast-run/run.json" ]; then echo '```json'; cat "$RUNNER_TEMP/forecast-run/run.json"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保存執行紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-run-${{ github.run_id }}
          path: ${{ runner.temp }}/forecast-run/
          retention-days: 90
          if-no-files-found: warn

      - name: 清除登入檔與暫存
        if: always()
        run: rm -rf "$RUNNER_TEMP/agy-home" "$RUNNER_TEMP/agy" "$RUNNER_TEMP/forecast.sql" "$RUNNER_TEMP/overseas"
