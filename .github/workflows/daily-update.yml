# 每日收盤後自動更新（票 11／外部票 08）。設計：.scratch/chart-screening-workbench/daily-update-design.md
#
# - 多個 cron 時段輪詢官方就緒；每個時段只檢查一次（--no-wait），不在 runner 裡 sleep 吃額度。
#   已知自動排程前三時段可 waiting（未發布）；最後時段、已過當日20:30、過期日或未知來源未就緒仍失敗。
# - rollout：先發布本 workflow／Python 相容輸入，再部署 Worker；回退先退 Worker，避免新 inputs 打舊 schema 422。
# - 同一資料日已成功：執行紀錄在 R2 工作集裡，後面的時段會回 already-done，不重做、不重部署。
#   要用新程式把同一天重算並發布，手動觸發時勾 republish（發布成新版本，原版留作上一版）。
# - 只有真的發布成功才把新的工作集同步回 R2；其他結果保留雲端上一版狀態。
# - GitHub 的 schedule 只在預設分支（main）觸發；分支上請用 workflow_dispatch 試跑。
name: daily-update

on:
  schedule:
    # UTC；台北時間（UTC+8）週一到週五 15:30、16:30、18:00、20:30。休市日由 daily_update.py 判斷並 skipped。
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "資料日 YYYY-MM-DD（留空＝台北時間今天）"
        required: false
        type: string
      dry_run:
        description: "只跑不改遠端的步驟（不匯入 D1、不部署、不同步工作集）"
        required: false
        type: boolean
        default: true
      redeploy:
        description: "資料不變、只重新部署程式（用最後一次發布保存的建置輸入重建網頁；不重算、不寫 D1、不同步工作集；date 會被忽略）"
        required: false
        type: boolean
        default: false
      republish:
        description: "同一資料日用現在的程式重算並發布成新版本（只接受目前線上那一版的資料日；原版留作上一版可退回）"
        required: false
        type: boolean
        default: false
      etf_raw_days:
        description: "一次性補抓 ETF 要用的每日行情原件：最近幾個資料日（1～300；留空＝不補）。本人 11-16 同意 130。要 dry_run=false，並勾 republish 重新發布目前線上那一天"
        required: false
        type: string
        default: ""
      plain_daily:
        description: "首頁白話分析每日重寫（留空＝照 repository variable MARKET_ANA_PLAIN_DAILY）。只在 dry_run 時有效：off／dry＝呼叫 Gemini 但只寫進執行紀錄／on＝用重寫的那份建置（乾跑不發布）"
        required: false
        type: choice
        options: ["", "off", "dry", "on"]
        default: ""
      trigger_source:
        description: "自動排程來源（Cloudflare 使用 cloudflare-cron；手動留空＝嚴格）"
        required: false
        type: string
        default: ""
      trigger_slot:
        description: "原始 UTC cron 時段（未知／缺省＝嚴格）"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # 三支正式 workflow 共用鎖且不取消；只序列化採用此 group 的 CI caller，跨資料域單調性仍由 cursor 驗證。
  group: market-state-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: market-ana-state
    steps:
      - name: 檢查金鑰
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            case "$missing" in
              *R2_*) echo "::error::缺少 R2 金鑰：$missing（R2 → Manage R2 API Tokens 建立後放進 GitHub Secrets）" ;;
              *) echo "::error::缺少 Cloudflare 金鑰：$missing" ;;
            esac
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-daily.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安裝相依
        run: python -m pip install -r requirements-daily.txt

      # dry-run 不碰 D1／Pages，token 壞了要到正式發布才會失敗；這裡先用唯讀指令確認 token 能用、權限夠。
      - name: 驗證 Cloudflare token（唯讀）
        run: |
          # Cloudflare API 偶爾回 503（11-13 23:37 的 run 就因此被判成 token 無效而整天沒發布）：每項最多試 3 次。
          check() {
            for attempt in 1 2 3; do
              if npx --yes wrangler@4 "$@" > /dev/null; then return 0; fi
              if [ "$attempt" -lt 3 ]; then sleep 20; fi
            done
            return 1
          }
          check d1 list || { echo "::error::試 3 次仍無法讀取 D1：CLOUDFLARE_API_TOKEN 無效、缺 D1 權限，或 Cloudflare API 暫時不可用"; exit 1; }
          check pages project list || { echo "::error::試 3 次仍無法讀取 Pages：CLOUDFLARE_API_TOKEN 無效、缺 Pages 權限，或 Cloudflare API 暫時不可用"; exit 1; }

      - name: 決定資料日
        id: day
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            # 手動輸入只接受 YYYY-MM-DD，其他一律拒絕（避免把任意字串帶進後面的命令）。
            if ! printf '%s' "$INPUT_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::date 必須是 YYYY-MM-DD"; exit 1
            fi
            day="$INPUT_DATE"
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$(date +%H)" -lt 15 ]; then
            # GitHub 排程可能延遲數小時：11-09 的 20:30 時段拖到 11-10 06:38 才觸發，被當成 11-10 而失敗。
            # 收盤前觸發的排程都是前一天時段延遲到的，資料日用前一天（週末或休市由 daily_update 判斷並略過）。
            day="$(date -d yesterday +%F)"
          else
            day="$(date +%F)"
          fi
          python -c 'from state_sync import require_iso_date; import sys; require_iso_date(sys.argv[1], "workflow date")' "$day" || { echo "::error::date 必須是真實的 YYYY-MM-DD"; exit 1; }
          echo "date=$day" >> "$GITHUB_OUTPUT"
          # 等待分類在 Python 以來源／slot／target日與實際處理時刻共同判定。
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "dry_run=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=" >> "$GITHUB_OUTPUT"
          fi

      - name: 從 R2 還原工作集
        run: python state_sync.py restore --target .

      # 首頁「籌碼與資金」白話分析每日重寫（本人 11-17 定案）：開關是獨立的 repository variable MARKET_ANA_PLAIN_DAILY，
      # off（預設，沒設或拼錯都算）／dry（呼叫 Gemini 並核對，只寫進執行紀錄，網站照舊）／on（發布重寫的那份）。
      # 手動觸發的 plain_daily 只在乾跑時有效；正式發布一律看 variable。只做程式部署的 redeploy 不建大盤包，不需要模型。
      # 白話分析併在大盤資料包建置裡（cloud/market_pack_daily.py → plain_daily.py），和數字同一包、同一資料日；
      # agy 或登入沒準備好不擋發布，改用程式依數字套句。
      - name: 決定白話分析模式
        id: plain
        env:
          PLAIN_SWITCH: ${{ vars.MARKET_ANA_PLAIN_DAILY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PLAIN: ${{ inputs.plain_daily }}
          INPUT_REDEPLOY: ${{ inputs.redeploy }}
        run: |
          mode="$(printf '%s' "$PLAIN_SWITCH" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          case "$mode" in on|dry) ;; *) mode=off ;; esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_PLAIN" ]; then
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              case "$INPUT_PLAIN" in on|dry|off) mode="$INPUT_PLAIN" ;; *) echo "::error::plain_daily 只接受 off／dry／on"; exit 1 ;; esac
            else
              echo "::notice::正式發布只看 repository variable MARKET_ANA_PLAIN_DAILY；plain_daily 只在乾跑時有效"
            fi
          fi
          if [ "$INPUT_REDEPLOY" = "true" ]; then mode=off; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "白話分析模式：$mode"

      - name: 白話分析：下載官方 agy 1.5.3 並核對 SHA-256
        id: plain_agy
        if: steps.plain.outputs.mode != 'off'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/agy" && cd "$RUNNER_TEMP/agy"
          curl -fsSL -o agy.tgz https://github.com/google-antigravity/antigravity-cli/releases/download/1.5.3/agy_cli_linux_x64.tar.gz
          echo "1b4850599cce73a17f94ffb422df3bf9531531b77dbddc40c1a435e0c2c16807  agy.tgz" | sha256sum -c
          tar xzf agy.tgz
          ./antigravity --version

      - name: 白話分析：還原登入檔到隔離 HOME（只給 agy 子行程用）
        id: plain_auth
        if: steps.plain.outputs.mode != 'off' && steps.plain_agy.outcome == 'success'
        continue-on-error: true
        env:
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
        run: |
          if [ -z "$AGY_LOGIN_BUNDLE" ]; then echo "::warning::缺少 secret AGY_LOGIN_BUNDLE，白話分析改用程式套句"; exit 1; fi
          home="$RUNNER_TEMP/agy-home"; mkdir -p "$home"; chmod 700 "$home"
          printf '%s' "$AGY_LOGIN_BUNDLE" | tr -d ' \r\n' | base64 -d | tar xzf - -C "$home"

      - name: 一次性補抓 ETF 要用的每日行情原件（手動填 etf_raw_days 才跑）
        # 2026-11-16 本人同意「最近 130 個交易日」：雲端工作集的原件只剩最近幾天，ETF 只回補得到幾根日線。
        # 對行情庫記著、原件卻不在的最近 N 個資料日，向證交所／櫃買重抓同一份每日行情原件（上市、上櫃同時，各自間隔 5 秒），
        # 位元組雜湊要和行情庫當初記的相同才放回，不同就丟；第一天就不同或任何不正常回應就停。補回後重掃 ETF（已有的列不動）。
        # 一天也沒補回而且有停下來就讓整個 run 失敗：不發布、不同步工作集。只放回原件與 ETF 列，同步回 R2 照原本只在發布成功時。
        if: inputs.etf_raw_days != ''
        shell: bash
        env:
          ETF_RAW_DAYS: ${{ inputs.etf_raw_days }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "::error::etf_raw_days 要搭配 dry_run=false（試跑不同步工作集，補抓的原件會白抓）"; exit 1
          fi
          if ! printf '%s' "$ETF_RAW_DAYS" | grep -Eq '^[0-9]{1,3}$'; then
            echo "::error::etf_raw_days 必須是 1～300 的整數"; exit 1
          fi
          status=0
          python etf_history.py --restore-raw-days "$ETF_RAW_DAYS" > "$RUNNER_TEMP/etf-raw-restore.json" || status=$?
          cat "$RUNNER_TEMP/etf-raw-restore.json"
          { echo "### ETF 原件補抓（結束碼 $status）"; echo '```json'; cat "$RUNNER_TEMP/etf-raw-restore.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: 公司重大訊息：補齊原件、抓當日、存回 R2
        # 個股頁事實區塊 D 票：原件另存在 R2 的 announcements/raw/（不在工作集），建置前先補齊才有近 90 天。
        # 失敗不擋發布：網站只是少了當天新增的公告。
        # 試跑只下載與在本機抓，不寫 R2（daily_update.py 的 --dry-run 也只跑不會動到遠端的步驟）。
        continue-on-error: true
        env:
          DRY_RUN: ${{ steps.day.outputs.dry_run }}
        run: |
          if [ -n "$DRY_RUN" ]; then python announcements.py daily --r2 --no-upload; else python announcements.py daily --r2; fi

      - name: 關注股的新聞標題：抓 Yahoo股市與中央社，寫進 D1
        # 自選股關注 C 票：只抓站主正在關注的股票（Yahoo 每檔一次）與中央社三個分類，標題、前言、連結直接寫進 D1 的 watch_news
        # （不跟個股資料版本走），超過 90 天的同時清掉。資料表還沒建立（0015 未套）就什麼都不抓。
        # 失敗不擋發布：個股頁的新聞那一塊會標「今天沒抓到」。試跑不寫 D1，所以整步跳過。
        if: steps.day.outputs.dry_run == ''
        continue-on-error: true
        env:
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: python watch_news.py daily --d1

      - name: 基金對照 0050：抓集保開放資料淨值、配息與央行匯率，存回 R2
        # 本人 11-17 定案：貝萊德世界科技 A10 和 0050 比（含息再投入、換台幣）。抽取檔另存 R2 的 funds/raw/（不在工作集）：
        # 集保開放資料的淨值只留約 4 個交易日，台股休市、沒有發布的日子也要照樣累積，所以不跟工作集「發布成功才同步」。
        # 每個來源一天最多抓一次；缺日、資料衝突、太久沒新淨值都寫進執行摘要並讓這一步顯示失敗（不擋發布）。
        # 漏抓超過約 3 個營業日會留下缺口，要到集保「基金資訊觀測站」網頁補（見 seeds/funds/BLKTENAU/backfill-manifest.json 的做法）。
        continue-on-error: true
        env:
          DRY_RUN: ${{ steps.day.outputs.dry_run }}
        run: |
          status=0
          if [ -n "$DRY_RUN" ]; then
            python fund_compare.py daily --r2 --no-upload > "$RUNNER_TEMP/fund-daily.json" || status=$?
          else
            python fund_compare.py daily --r2 > "$RUNNER_TEMP/fund-daily.json" || status=$?
          fi
          cat "$RUNNER_TEMP/fund-daily.json"
          { echo "### 基金對照資料（結束碼 $status）"; echo '```json'; cat "$RUNNER_TEMP/fund-daily.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: 每日更新
        id: run
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger_source }}
          TRIGGER_SLOT: ${{ github.event_name == 'schedule' && github.event.schedule || inputs.trigger_slot }}
          PLAIN_DAILY_MODE: ${{ steps.plain.outputs.mode }}
          PLAIN_AGY_BIN: ${{ steps.plain_auth.outcome == 'success' && format('{0}/agy/antigravity', runner.temp) || '' }}
          PLAIN_AGY_HOME: ${{ steps.plain_auth.outcome == 'success' && format('{0}/agy-home', runner.temp) || '' }}
          # 白話分析用的模型與思考程度（本人 11-17：Flash、medium）；要換只改這兩行
          PLAIN_MODEL: gemini-3.8-flash
          PLAIN_EFFORT: medium
        run: >-
          python daily_update.py
          --date "${{ steps.day.outputs.date }}"
          --no-wait
          --trigger-event "$TRIGGER_EVENT"
          --trigger-source "$TRIGGER_SOURCE"
          --trigger-slot "$TRIGGER_SLOT"
          ${{ steps.day.outputs.dry_run }}
          ${{ inputs.redeploy == true && '--redeploy' || '' }}
          ${{ inputs.republish == true && '--republish' || '' }}
          --result-file "${{ runner.temp }}/daily-result.json"

      - name: 同步工作集回 R2（只在發布成功時）
        if: success() && steps.day.outputs.dry_run == ''
        run: |
          sync=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['sync_state'])" "${{ runner.temp }}/daily-result.json")
          if [ "$sync" = "True" ]; then
            python state_sync.py upload --data-date "${{ steps.day.outputs.date }}" --cursor-domain market
          else
            echo "本次沒有新發布，雲端工作集維持上一版"
          fi

      - name: 國外同類股行情（只在發布成功時）
        # 自選股關注 B 票：站主確認過的國外同類股逐檔取日線，寫進雲端資料庫的 overseas_quotes（只給站主看）。
        # 每個交易日只在發布成功那一班跑一次（EODHD 每天 20 次要和水位、事前預測共用）。
        # EODHD 走共用快取（R2 eodhd-cache/，G 票延伸 2026-11-17）：大盤預測已經抓過的指數不再打。
        # 失敗不擋發布：每一檔各自標「過期」，網站照常。金鑰沒設定時那個來源整批標「沒有金鑰」。
        if: success() && steps.day.outputs.dry_run == ''
        continue-on-error: true
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          sync=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['sync_state'])" "${{ runner.temp }}/daily-result.json")
          if [ "$sync" = "True" ]; then
            python overseas_peers.py daily --shared-cache
          else
            echo "本次沒有新發布，不抓國外同類股"
          fi

      - name: 建立本次發布證據
        id: publication_evidence
        if: success() && steps.run.outcome == 'success'
        env:
          DRY_RUN: ${{ steps.day.outputs.dry_run != '' }}
        run: >-
          python ai_digest_trigger.py create-evidence
          --daily-result "${{ runner.temp }}/daily-result.json"
          --dry-run "$DRY_RUN"
          --run-id "${{ github.run_id }}"
          --head-sha "${{ github.sha }}"
          --repository "${{ github.repository }}"
          --head-branch "${{ github.ref_name }}"
          --output "${{ runner.temp }}/daily-publication.json"

      - name: 保存發布證據供同一 run 的 AI 接續核對
        if: steps.publication_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: daily-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-publication.json
          retention-days: 3
          if-no-files-found: error

      - name: 執行摘要
        if: always()
        run: |
          {
            echo "### 每日更新 ${{ steps.day.outputs.date }}"
            if [ -f "${{ runner.temp }}/daily-result.json" ]; then
              echo '```json'; cat "${{ runner.temp }}/daily-result.json"; echo '```'
            fi
            if [ -f data/daily-update-log/status.json ]; then
              echo '```json'; cat data/daily-update-log/status.json; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 白話分析摘要
        if: always() && steps.plain.outputs.mode != 'off' && steps.plain.outputs.mode != ''
        env:
          DAY: ${{ steps.day.outputs.date }}
          MODE: ${{ steps.plain.outputs.mode }}
        run: |
          file="data/daily-update-log/plain-daily/$DAY.json"
          {
            echo "### 首頁白話分析（模式 $MODE）"
            if [ -f "$file" ]; then
              python -c 'import json,sys; a=json.load(open(sys.argv[1],encoding="utf-8")); c=a.get("published") or a.get("candidate") or {}; print("- 來源：", a.get("source"), "；失敗原因：", a.get("failure"), "；核對沒過：", len(a.get("rejected") or []), "處"); [print("  -", r) for r in (a.get("rejected") or [])[:5]]; print("- 一句話：", c.get("one_line"))' "$file"
              echo "（全文與核對紀錄在執行紀錄 artifact 的 plain-daily/$DAY.json）"
            else
              echo "沒有白話分析紀錄檔：這一班沒建大盤資料包（等待、已完成或失敗在前面的步驟），或紀錄寫入失敗（看每日更新輸出裡 plain_daily 的 audit_error）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保存執行紀錄（包含等待與失敗）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-log-${{ steps.day.outputs.date }}
          path: data/daily-update-log/
          retention-days: 30
          if-no-files-found: ignore

      - name: 清除 agy 登入檔與執行檔
        if: always()
        run: rm -rf "$RUNNER_TEMP/agy-home" "$RUNNER_TEMP/agy"
