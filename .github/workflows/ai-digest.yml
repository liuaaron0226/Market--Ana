# G4-2R：daily-update 確認正式發布後，以本人 CI 的官方 agy -p 產生每日解讀。
# 邊界：只從 R2 restore；不呼叫 state_sync.py upload；agy 不在網站請求或後端內執行。
name: ai-digest

on:
  workflow_run:
    workflows: [daily-update]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "市場資料日 YYYY-MM-DD（留空＝還原資料中的市場最新日）"
        required: false
        type: string
      dry_run:
        description: "只整理輸入並驗 prompt/schema，不呼叫 agy、不寫 D1"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  # 三支正式 workflow 共用鎖且不取消；只序列化採用此 group 的 CI caller，不取代 immutable manifest 原子性。
  group: market-state-write
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
      dry_run: ${{ steps.auth.outputs.dry_run }}
      requested_date: ${{ steps.auth.outputs.data_date }}
      head_sha: ${{ steps.auth.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 核心版策略預設停用門
        id: gate
        env:
          MARKET_ANA_STRATEGIES_ENABLED: ${{ vars.MARKET_ANA_STRATEGIES_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: node cloud/strategy-workflow.mjs

      - name: 下載觸發 run 的正式發布證據
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: daily-publication-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/publication
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail-closed 核准執行模式
        id: auth
        if: steps.gate.outputs.allowed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.date }}
          AUTH_DRY_RUN: ${{ steps.gate.outputs.dry_run }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 日期會原樣寫進 GITHUB_OUTPUT；夾帶換行就能多塞一行 dry_run=false，寫入前先擋。
            if [ -n "$INPUT_DATE" ] && ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::date 必須是 YYYY-MM-DD"; exit 1
            fi
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=${AUTH_DRY_RUN:-true}" >> "$GITHUB_OUTPUT"
            echo "data_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
            echo "head_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            python ai_digest_trigger.py authorize \
              --evidence "$RUNNER_TEMP/publication/daily-publication.json" \
              --expected-run-id "$EXPECTED_RUN_ID" \
              --expected-head-sha "$EXPECTED_HEAD_SHA" \
              --expected-repository "$EXPECTED_REPOSITORY" \
              --expected-branch "$EXPECTED_BRANCH" \
              --conclusion "$UPSTREAM_CONCLUSION" \
              --github-output "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
      # 倉庫公開之後 variable 會原樣印在每一步的環境變數裡；站主的 email 改放 secret（輸出裡會被遮掉）
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-daily.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安裝既有每日更新相依
        run: python -m pip install -r requirements-daily.txt

      - name: 決定執行模式並檢查契約
        id: mode
        env:
          INPUT_DATE: ${{ needs.authorize.outputs.requested_date }}
          AUTH_DRY_RUN: ${{ needs.authorize.outputs.dry_run }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python -c 'from state_sync import require_iso_date; import sys; require_iso_date(sys.argv[1], "workflow date")' "$INPUT_DATE" || { echo "::error::date 必須是真實的 YYYY-MM-DD"; exit 1; }
          fi
          if [ -z "$OWNER_EMAIL" ] || ! printf '%s' "$OWNER_EMAIL" | grep -Eq "^[^@[:space:]']+@[^@[:space:]']+$"; then
            echo "::error::缺少或無效的 secret OWNER_EMAIL"; exit 1
          fi
          dry_run=true
          if [ "$AUTH_DRY_RUN" = "false" ]; then dry_run=false; fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then echo "::error::缺少 secret $name"; exit 1; fi
          done
          if [ "$dry_run" = "false" ] && [ -z "$AGY_LOGIN_BUNDLE" ]; then
            echo "::error::缺少 secret AGY_LOGIN_BUNDLE"; exit 1
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "requested_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"

      - name: 驗證 Cloudflare token（唯讀）
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 list > /dev/null

      - name: 從 R2 還原需要的資料（唯讀）
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: market-ana-state
        run: python state_sync.py restore --target .

      - name: 重建已定義的籌碼與 0050 對照資料包
        run: |
          python cloud/build_screens_pack.py --snapshot-root data/market-screen-snapshots --out cloud/.screens-pack.json
          if [ -n "${{ steps.mode.outputs.requested_date }}" ]; then
            day="${{ steps.mode.outputs.requested_date }}"
          else
            day="$(python ai_digest_inputs.py --print-latest-date --stock-pack cloud/.stock-pack.json --screens-root data/market-screen-snapshots)"
          fi
          python cloud/build_compare_pack.py --universe "data/liquid-universe/$day.json" --out cloud/.compare-pack.json
          echo "DATA_DATE=$day" >> "$GITHUB_ENV"

      - name: 從 D1 讀取本人的自選股與庫存
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute market-ana-accounts --remote --json --command \
            "SELECT 'watchlist' AS kind,email,code,name,market,horizon,NULL AS shares,NULL AS average_cost,NULL AS last_price,NULL AS price_as_of FROM user_watchlist WHERE email='$OWNER_EMAIL' UNION ALL SELECT 'holding' AS kind,email,code,name,market,NULL AS horizon,shares,average_cost,last_price,price_as_of FROM user_holdings WHERE email='$OWNER_EMAIL'" \
            > "$RUNNER_TEMP/owner-portfolio.json"

      - name: 整理精簡輸入並保存 SHA
        run: |
          python ai_digest_inputs.py \
            --date "$DATA_DATE" \
            --market-dir data/daily-update-state/last-market-pack \
            --screens-root data/market-screen-snapshots \
            --stock-pack cloud/.stock-pack.json \
            --compare-pack cloud/.compare-pack.json \
            --portfolio-json "$RUNNER_TEMP/owner-portfolio.json" \
            --owner-email "$OWNER_EMAIL" \
            --output "$RUNNER_TEMP/ai-digest-input.json" \
            --sha-file "$RUNNER_TEMP/ai-digest-input.sha256"

      - name: 讀設定頁的 AI 模型（本人 11-19 晚；讀不到照 gemini_models.py 的預設跑）
        # 站主在設定頁「AI 模型」選的模型與思考強度（D1 ai_model_settings）；gemini_settings.py 寫進 GITHUB_ENV，
        # 這一班有沒有讀到記在 ai-model-read.sql，記用量那一步一起寫進 D1（設定頁標「上一班沒讀到你的設定」）。
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (cd cloud && npx --yes wrangler@4 d1 execute market-ana-accounts --remote --json \
            --command "SELECT task, model, effort FROM ai_model_settings" > "$RUNNER_TEMP/ai-models.json") \
            || echo "::warning::讀不到設定頁的 AI 模型設定"
          python gemini_settings.py --input "$RUNNER_TEMP/ai-models.json" --github-env "$GITHUB_ENV" \
            --task ai-digest --run-id "$GITHUB_RUN_ID" --read-sql "$RUNNER_TEMP/ai-model-read.sql"

      - name: 安裝模型目錄同一快照的官方 agy（驗 SHA-256）
        id: agy_download
        if: steps.mode.outputs.dry_run == 'false'
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: market-ana-state
        run: |
          python gemini_runtime.py install --directory "$RUNNER_TEMP/agy" --snapshot "$RUNNER_TEMP/gemini-catalog.json" --github-env "$GITHUB_ENV"

      - name: 還原登入檔到隔離 HOME
        id: agy_auth
        if: steps.mode.outputs.dry_run == 'false' && steps.agy_download.outcome == 'success'
        continue-on-error: true
        env:
          AGY_LOGIN_BUNDLE: ${{ secrets.AGY_LOGIN_BUNDLE }}
        run: |
          home="$RUNNER_TEMP/agy-home"; mkdir -p "$home"; chmod 700 "$home"
          printf '%s' "$AGY_LOGIN_BUNDLE" | tr -d ' \r\n' | base64 -d | tar xzf - -C "$home"

      - name: 確認模型可用性（停用才替代，保留手動設定）
        if: steps.mode.outputs.dry_run == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: market-ana-state
        run: |
          python gemini_runtime.py prepare --directory "$RUNNER_TEMP/agy" --snapshot "$RUNNER_TEMP/gemini-catalog.json" --home "$RUNNER_TEMP/agy-home" \
            --input "$RUNNER_TEMP/ai-models.json" --task ai-digest --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --github-env "$GITHUB_ENV"

      - name: 驗證 prompt/schema（dry-run）
        if: steps.mode.outputs.dry_run == 'true'
        run: |
          python ai_digest.py \
            --input "$RUNNER_TEMP/ai-digest-input.json" \
            --output "$RUNNER_TEMP/ai-digest-result.json" \
            --audit "$RUNNER_TEMP/ai-digest-audit.json" \
            --prompt-output "$RUNNER_TEMP/ai-digest-prompt.txt" \
            --schema-output "$RUNNER_TEMP/ai-digest-schema.json" \
            --dry-run

      - name: 跑官方 agy 並逐項驗證
        if: success() && steps.mode.outputs.dry_run == 'false'
        env:
          HOME: ${{ runner.temp }}/agy-home
        run: |
          # 模型與思考強度照設定頁（讀不到時是空的，ai_digest.py 照預設）
          common=(--input "$RUNNER_TEMP/ai-digest-input.json" --model "$AI_DIGEST_MODEL" --effort "$AI_DIGEST_EFFORT"
                  --output "$RUNNER_TEMP/ai-digest-result.json" --audit "$RUNNER_TEMP/ai-digest-audit.json"
                  --sql-output "$RUNNER_TEMP/ai-digest.sql")
          if [ "${{ steps.agy_download.outcome }}" = "success" ] && [ "${{ steps.agy_auth.outcome }}" = "success" ]; then
            python ai_digest.py "${common[@]}" --agy-bin "$RUNNER_TEMP/agy/antigravity"
          else
            python ai_digest.py "${common[@]}" --mark-failure agy_setup_failed
          fi

      - name: 寫入 D1
        if: success() && steps.mode.outputs.dry_run == 'false'
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -f "$RUNNER_TEMP/ai-digest.sql" ]; then echo "::error::沒有可寫入的 AI 解讀狀態"; exit 1; fi
          npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/ai-digest.sql"

      - name: 執行摘要
        if: always()
        run: |
          {
            echo "### 每日 AI 解讀 ${DATA_DATE:-未決定}"
            if [ -f "$RUNNER_TEMP/ai-digest-input.sha256" ]; then echo "- 輸入 SHA：$(cat "$RUNNER_TEMP/ai-digest-input.sha256")"; fi
            echo "- dry-run：${{ steps.mode.outputs.dry_run }}"
            # 倉庫公開之後步驟摘要誰都看得到：逐檔的判斷（站主的自選股與庫存）不放，只放每一類、每一種狀態各幾筆。
            # 完整的結果在網站資料庫（寫入 D1 那一步）。
            if [ -f "$RUNNER_TEMP/ai-digest-result.json" ]; then
              python -c 'import collections,json,sys; rows=json.load(open(sys.argv[1],encoding="utf-8")).get("rows") or []; c=collections.Counter(str(r.get("digest_type"))+" "+str(r.get("status")) for r in rows if isinstance(r,dict)); print("- 結果：共", len(rows), "筆"); [print("  -", k, "：", n, "筆") for k, n in sorted(c.items())]' "$RUNNER_TEMP/ai-digest-result.json" || echo "- 結果檔讀不了"
            fi
            if [ -f "$RUNNER_TEMP/ai-digest-audit.json" ]; then
              python -c 'import json,sys; a=json.load(open(sys.argv[1],encoding="utf-8")); print("- 模型：", a.get("model"), a.get("effort"), "；失敗原因：", a.get("failure"), "；核對沒過：", len(a.get("rejected") or []), "處")' "$RUNNER_TEMP/ai-digest-audit.json" || echo "- 核對紀錄讀不了"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 記下 Gemini 剩餘用量（設定頁用；失敗不影響這支排程）
        # agy -p /usage 由 CLI 自己回答、不耗額度；讀不到也記下這次跑過（gemini_usage.py）。只有站主在設定頁看得到。
        if: always() && steps.agy_auth.outcome == 'success' && steps.mode.outputs.dry_run == 'false'
        continue-on-error: true
        env:
          HOME: ${{ runner.temp }}/agy-home
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python gemini_usage.py --agy-bin "$RUNNER_TEMP/agy/antigravity" --task ai-digest --run-id "$GITHUB_RUN_ID" \
            --model "$AI_DIGEST_MODEL" --sql-output "$RUNNER_TEMP/gemini-usage.sql"
          cd cloud && npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/gemini-usage.sql"
          npx --yes wrangler@4 d1 execute market-ana-accounts --remote --file "$RUNNER_TEMP/ai-model-read.sql" \
            || echo "::warning::這一班讀設定的結果寫不進去（遷移 0030 可能還沒套用）"

      - name: 清除登入檔與暫存輸入
        if: always()
        run: rm -rf "$RUNNER_TEMP/agy-home" "$RUNNER_TEMP/agy" "$RUNNER_TEMP/owner-portfolio.json" "$RUNNER_TEMP/ai-digest-input.json" "$RUNNER_TEMP/ai-digest-prompt.txt" "$RUNNER_TEMP/ai-digest-schema.json" "$RUNNER_TEMP/ai-digest-result.json" "$RUNNER_TEMP/ai-digest-audit.json" "$RUNNER_TEMP/ai-digest.sql" "$RUNNER_TEMP/gemini-usage.sql" "$RUNNER_TEMP/ai-models.json" "$RUNNER_TEMP/ai-model-read.sql"
