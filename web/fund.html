<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>基金</title>
  <!-- 基金當成一般個股 03 票（本人 2026-11-18）：基金對照頁退場，基金就在個股頁看（stock.html?code=<代碼>）。
       這一頁只把舊書籤與舊連結（fund.html?code=BLKTENAU）帶過去；代碼不合規則就帶到個股頁預設那一檔。 -->
  <script>
    (function () {
      var code = new URLSearchParams(location.search).get('code') || '';
      code = code.trim().toUpperCase();
      location.replace(/^[0-9A-Z]{4,12}$/.test(code) ? 'stock.html?code=' + encodeURIComponent(code) : 'stock.html');
    })();
  </script>
</head>
<body>
  <p><a href="stock.html">前往個股頁</a></p>
</body>
</html>
