<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="決策鏡">
  <meta name="theme-color" content="#0b0b0e">
  <title>自選股與庫存｜台股決策鏡</title>
  <link rel="stylesheet" href="minimal.css?v=20261118-m55">
  <link rel="stylesheet" href="chart-studies.css?v=20261118-m55">
  <link rel="stylesheet" href="bold.css?v=20261118-m55">
  <link rel="stylesheet" href="swipe-rows.css?v=20261118-m55">
  <link rel="stylesheet" href="portfolio.css?v=20261118-m55">
  <link rel="stylesheet" href="watch-judgments.css?v=20261118-m55">
  <link rel="stylesheet" href="watch-push.css?v=20261118-m55">
  <link rel="stylesheet" href="settings.css?v=20261118-m56">
  <link rel="stylesheet" href="stock-picker.css?v=20261118-m55">
</head>
<body class="bd pf">
  <a class="skip-link" href="#portfolioMain">跳到自選股與庫存</a>
  <div class="pf-shell" data-ui data-desk-tilt>
    <header class="pf-bar">
      <a class="pf-back" href="minimal.html" aria-label="回到大盤首頁"><span aria-hidden="true">←</span> 大盤首頁</a>
      <div class="pf-brand" aria-label="台股決策鏡">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 23.5 10.5 17l4.5 3.5L24.5 9l3.5 3.5M22 9h6v6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>台股決策鏡</span>
      </div>
      <div class="pf-bar-end">
        <!-- 設定（本人 2026-11-17 選樣品 A）：到價推播原本的鈴鐺與主題鍵都收進這顆齒輪，見 settings.js -->
        <button class="pf-theme" id="settingsOpen" type="button" data-settings-open aria-label="設定" title="設定">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.5h3.4l.5 2.3 1.6.9 2.2-.8 1.7 2.9-1.7 1.6v1.8l1.7 1.6-1.7 2.9-2.2-.8-1.6.9-.5 2.3h-3.4l-.5-2.3-1.6-.9-2.2.8-1.7-2.9 1.7-1.6v-1.8L4.1 8.8l1.7-2.9 2.2.8 1.6-.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </header>

    <main id="portfolioMain">
      <div class="pf-title-row">
        <h1>自選股與庫存</h1>
        <p class="pf-freshness" id="portfolioFreshness" role="status">讀取中</p>
      </div>
      <p class="pf-ai-notice" id="friendAiNotice" role="status" hidden><span id="friendAiNoticeText"></span><a href="/gemini/">前往 Gemini 設定 <span aria-hidden="true">›</span></a></p>

      <section class="pf-level" id="levelPanel" aria-labelledby="levelTitle" hidden>
        <div class="pf-level-head">
          <div>
            <h2 id="levelTitle">今日股票水位</h2>
            <p id="levelDate">等待今日資料</p>
          </div>
          <p class="pf-level-status" id="levelStatus" role="status">讀取中</p>
        </div>
        <p class="pf-level-conclusion" id="levelConclusion">正在整理大盤情勢與目前部位。</p>
        <div class="pf-level-figures">
          <div><span>今日建議</span><strong class="num" id="recommendedLevel">—</strong></div>
          <div><span>目前水位</span><strong class="num" id="currentLevel">—</strong></div>
          <div><span>相差</span><strong class="num" id="levelGap">—</strong></div>
          <div><span>約需調整</span><strong class="num" id="levelAmount">—</strong></div>
        </div>
        <ul class="pf-level-points" id="levelPoints"></ul>
        <form class="pf-cash-form" id="cashForm">
          <label for="cashAmount">計入總資金的現金</label>
          <div><input id="cashAmount" name="amount_twd" type="number" inputmode="decimal" min="0" max="1000000000000" step="1" placeholder="不含緊急預備金" required><button type="submit">更新現金</button></div>
          <p id="cashMeta">尚未申報</p>
        </form>
        <details class="pf-level-details" id="levelDetails">
          <summary>查看分數、確認與加碼進度</summary>
          <div id="levelBreakdown"></div>
        </details>
      </section>

      <!-- 自選與庫存併成一份清單（本人 2026-11-16：頁面太長、要整合；同日改成手勢版）：一檔只出現一次，上面三顆鍵篩全部／庫存／自選；
           點名稱進個股頁、點那一列展開、向左滑露出修改與刪除；按「自選」時照自己取名的群組分段；新增收進「＋」鍵。
           資料整理在 portfolio-list.js、holdings-rows.js，向左滑在 swipe-rows.js，畫面在 portfolio.js。 -->
      <section class="pf-summary" aria-labelledby="listTitle">
        <h2 id="listTitle" class="sr-only">自選與庫存</h2>
        <p class="hv-total" id="totalLine"><strong class="num" id="totalMarketValue" aria-label="目前市值">—</strong><span>成本 <b class="num" id="totalCost">—</b></span><span><span id="totalWord">損益</span> <b class="num" id="totalPnl">—</b>（<b class="num" id="totalReturn">—</b>）</span></p>
        <div class="pf-tools">
          <div class="hm-cats" id="listFilter" role="group" aria-label="要看哪些">
            <button type="button" data-filter="all" aria-pressed="true">全部<small class="num" id="countAll">0</small></button>
            <button type="button" data-filter="holding" aria-pressed="false">庫存<small class="num" id="countHolding">0</small></button>
            <button type="button" data-filter="watch" aria-pressed="false">自選<small class="num" id="countWatch">0</small></button>
          </div>
          <button type="button" class="pf-add" id="addToggle" aria-expanded="false" aria-controls="addPanel" aria-label="新增自選或庫存">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="pf-add-panel" id="addPanel">
          <div class="pf-add-clip" id="addClip" inert>
            <div class="pf-add-in">
              <form class="pf-form pf-add-form" id="addForm" novalidate>
                <div class="pf-add-code"><label for="addCode">股票代號或名稱</label><input id="addCode" name="code" autocomplete="off" maxlength="24" placeholder="例如 2330、台積電"></div>
                <button type="submit" id="addWatch">加入自選</button>
                <button type="button" class="pf-ghost" id="addHolding" aria-expanded="false" aria-controls="addMore">新增庫存</button>
                <div class="pf-add-more" id="addMore" hidden>
                  <!-- 選到基金時兩格換成「單位數」「台幣總成本」（07 票，本人 11-17 定案；portfolio.js setAddKind） -->
                  <label><span id="holdingSharesLabel">股數</span><input id="holdingShares" name="shares" type="number" inputmode="numeric" min="1" max="1000000000" step="1"></label>
                  <label><span id="holdingCostLabel">平均成本</span><input id="holdingCost" name="average_cost" type="number" inputmode="decimal" min="0.01" max="10000000" step="any"></label>
                  <label class="pf-wide">備註<input id="holdingNote" name="note" maxlength="200" placeholder="選填，最多 200 字"></label>
                  <button type="button" class="pf-wide" id="saveHolding">儲存庫存</button>
                </div>
                <p class="pf-form-status" id="addStatus" role="status"></p>
              </form>
            </div>
          </div>
        </div>
        <p class="pf-form-status pf-list-status" id="listStatus" role="status"></p>
        <ol class="hv-rows" id="holdingRows"></ol>
      </section>
    </main>
  </div>
  <script src="watch-judgments.js?v=20261118-m55" defer></script>
  <script src="scroll-lock.js?v=20261118-m55" defer></script>
  <script src="no-zoom.js?v=20261118-m55" defer></script>
  <script src="watch-push.js?v=20261118-m55" defer></script>
  <script src="holdings-rows.js?v=20261118-m55" defer></script>
  <script src="portfolio-list.js?v=20261118-m55" defer></script>
  <script src="swipe-rows.js?v=20261118-m55" defer></script>
  <script src="stock-picker.js?v=20261118-m55" defer></script>
  <script src="portfolio.js?v=20261118-m55" defer></script>
  <script src="chart-menus.js?v=20261118-m55" defer></script>
  <script src="desk-tilt.js?v=20261118-m55" defer></script>
  <script src="settings.js?v=20261118-m56" defer></script>
</body>
</html>
