<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="決策鏡">
  <meta name="theme-color" content="#0b0b0e">
  <title>個股分析</title>
  <link rel="stylesheet" href="minimal.css?v=20261117-m53">
  <link rel="stylesheet" href="chart-studies.css?v=20261117-m53">
  <link rel="stylesheet" href="bold.css?v=20261117-m53">
  <link rel="stylesheet" href="stock.css?v=20261117-n1">
  <link rel="stylesheet" href="stock-facts.css?v=20261117-m53">
  <link rel="stylesheet" href="stock-signals.css?v=20261117-m53">
  <link rel="stylesheet" href="watch-peers.css?v=20261117-m53">
  <link rel="stylesheet" href="forecast.css?v=20261117-m53">
  <link rel="stylesheet" href="watch-judgments.css?v=20261117-m53">
  <link rel="stylesheet" href="watch-push.css?v=20261117-m53">
  <link rel="stylesheet" href="settings.css?v=20261117-m53">
  <link rel="stylesheet" href="stock-picker.css?v=20261117-n1">
</head>
<body class="bd st">
  <div class="bd-shell" data-desk-tilt>
    <header class="bd-bar">
      <a class="bd-back" href="minimal.html"><span aria-hidden="true">‹</span> 大盤</a>
      <form class="bd-search" id="searchForm" role="search">
        <label class="sr-only" for="codeInput">股票代號或名稱</label>
        <input id="codeInput" name="code" type="search" enterkeyhint="search" autocomplete="off" placeholder="代號或名稱，例如 2330、台積電" maxlength="24">
        <button type="submit">查詢</button>
      </form>
      <!-- 設定（本人 2026-11-17 選樣品 A），見 settings.js -->
      <button class="bd-theme" id="settingsOpen" type="button" data-settings-open aria-label="設定" title="設定">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.5h3.4l.5 2.3 1.6.9 2.2-.8 1.7 2.9-1.7 1.6v1.8l1.7 1.6-1.7 2.9-2.2-.8-1.6.9-.5 2.3h-3.4l-.5-2.3-1.6-.9-2.2.8-1.7-2.9 1.7-1.6v-1.8L4.1 8.8l1.7-2.9 2.2.8 1.6-.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </header>

    <p class="bd-status" id="status" role="status">讀取中</p>

    <section class="bd-outside" id="outside" hidden>
      <h1 id="outsideTitle">不在本站涵蓋範圍</h1>
      <p class="bd-outside-reason" id="outsideReason"></p>
      <p class="bd-outside-meta num" id="outsideMeta"></p>
      <p class="bd-outside-rule">本站只涵蓋大量股與 0050。</p>
    </section>

    <main id="content" hidden>
      <!-- 看盤桌（C 包第 2 片）：報價、當日三格、操作策略是同一塊板 -->
      <div class="st-top">
      <section class="bd-quote" aria-label="報價">
        <div class="bd-ident">
          <h1><span id="stockName">—</span></h1>
          <p><span class="num" id="stockCode">—</span><span class="bd-dot" aria-hidden="true">·</span><span id="stockMarket" hidden></span><span class="bd-dot" aria-hidden="true">·</span><span id="quoteMode">資料日</span> <span class="num" id="asOf"></span></p>
        </div>
        <div class="bd-price">
          <div class="bd-price-line"><b class="num" id="close">—</b><span class="bd-live-badge" id="liveBadge" hidden>LIVE</span></div>
          <b class="num" id="chg"></b>
          <p class="bd-live-status" id="liveStatus" role="status">收盤資料</p>
        </div>
      </section>

      <section class="sf" id="stockFacts" aria-label="今天" hidden></section>

      <section class="bd-strategy" id="strategy" aria-labelledby="strategyConclusion" hidden>
        <h2 id="strategyConclusion">—</h2>
        <details id="strategyDetails">
          <summary>操作價位</summary>
          <div class="bd-strategy-grid">
            <div><span>進場價</span><b class="num" id="strategyEntry">—</b></div>
            <div><span>加碼價</span><b class="num" id="strategyAdd">—</b></div>
            <div><span>停損價</span><b class="num" id="strategyStop">—</b></div>
            <div><span>目標價</span><b class="num" id="strategyTarget">—</b></div>
          </div>
          <p id="strategyEvidence"></p>
        </details>
      </section>
      </div>

      <div class="bd-stage">
        <section class="bd-chart sk-chart-card" aria-labelledby="chartTitle">
          <div class="bd-chart-bar">
            <div>
              <h2 id="chartTitle" class="sr-only">價格走勢</h2>
              <p id="stockChartContext">日K</p>
            </div>
            <label class="bd-period" for="periodSelect">
              <span class="sr-only">週期</span>
              <select id="periodSelect">
                <optgroup label="">
                  <option value="1s">1秒</option>
                  <option value="5s">5秒</option>
                  <option value="10s">10秒</option>
                  <option value="15s">15秒</option>
                  <option value="30s">30秒</option>
                </optgroup>
                <optgroup label="">
                  <option value="1m">1分K</option>
                  <option value="5m">5分K</option>
                  <option value="15m">15分K</option>
                  <option value="60m">60分K</option>
                </optgroup>
                <optgroup label="">
                  <option value="daily" selected>日K</option>
                  <option value="weekly">週K</option>
                  <option value="monthly">月K</option>
                </optgroup>
              </select>
            </label>
            <div class="chart-ma">
              <button type="button" class="chart-chip" id="maChip" aria-expanded="false" aria-controls="maMenu">均線 <span id="maChipValue"></span></button>
              <div class="chart-menu chart-ma-menu" id="maMenu" hidden>
                <div class="bd-ma-row">
                  <div class="bd-ma-controls" id="maControls" aria-label="均線期數"></div>
                  <button class="bd-ma-add" id="addMa" type="button">新增均線</button>
                </div>
              </div>
            </div>
          </div>
          <div class="bd-draw-row">
          <div class="bd-draw" id="drawTools" role="toolbar" aria-label="畫線工具" hidden>
            <button type="button" data-tool="trend" data-tip="趨勢線" aria-label="趨勢線" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 16.2 16.6 7.8"/><circle cx="5.5" cy="18" r="2.5"/><circle cx="18.5" cy="6" r="2.5"/></svg>
            </button>
            <button type="button" data-tool="hline" data-tip="水平線" aria-label="水平線" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h6.5m5 0H21"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
            <button type="button" data-tool="ray" data-tip="射線" aria-label="射線" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 16.2 21 3.8"/><circle cx="5.5" cy="18" r="2.5"/></svg>
            </button>
            <button type="button" data-tool="rect" data-tip="矩形" aria-label="矩形" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5h8M17.5 8v8M16 17.5H8M6.5 16V8"/><circle cx="6.5" cy="6.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/></svg>
            </button>
            <button type="button" data-tool="fib" data-tip="黃金分割" aria-label="黃金分割" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h12.5M3 10.5h18M3 14h18M8.5 18.5H21"/><circle cx="18.5" cy="5.5" r="2.5"/><circle cx="5.5" cy="18.5" r="2.5"/></svg>
            </button>
            <button type="button" data-tool="text" data-tip="文字標註" aria-label="文字標註" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8V5.5h13V8M12 5.5v13M9.5 18.5h5"/></svg>
            </button>
            <button type="button" class="bd-draw-delete" id="drawDelete" data-tip="刪除" aria-label="刪除選取的線" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5M10.2 10.5v5.5m3.6-5.5v5.5"/></svg>
            </button>
          </div>
          <span class="bd-draw-unsaved" id="drawUnsaved" role="status" hidden></span>
          </div>
          <div class="bd-chart-host sk-chart" id="chartHost"></div>
          <div id="chartStudies"></div>
        </section>
      </div>

      <!-- 分類鍵：報價與 K 線以外的都收在這三類裡（本人 2026-11-15：一進去全部攤開、沒辦法選現在要看什麼）。
           一開始都收著，點哪一顆開哪一類，再點收回，一次只開一類；開合由 home-fold.js 處理，和首頁同一套。 -->
      <div class="hm-cats" id="stockCats" role="group" aria-label="更多資料">
        <button type="button" aria-expanded="false" aria-controls="levelsPanel">價位</button>
        <button type="button" aria-expanded="false" aria-controls="chipsPanel">籌碼</button>
        <button type="button" aria-expanded="false" aria-controls="comparePanel">對照 0050</button>
      </div>
      <section class="bd-cat" id="levelsPanel" data-cat-panel="levels" aria-label="價位">
        <aside class="bd-rail" aria-label="價格結構">
          <h2>價位階梯</h2>
          <ol class="bd-ladder" id="ladder">
            <li class="lad lad-res" data-key="resistance2"><span class="lad-name">壓力二</span><b class="num" id="resistance2">—</b><small id="resistance2Meta"></small></li>
            <li class="lad-gap" aria-hidden="true"></li>
            <li class="lad lad-res" data-key="resistance1"><span class="lad-name">壓力一</span><b class="num" id="resistance1">—</b><small id="resistance1Meta"></small></li>
            <li class="lad-gap" aria-hidden="true"></li>
            <li class="lad lad-now" data-key="close"><span class="lad-name" id="ladderCurrentLabel">收盤</span><b class="num" id="ladderClose">—</b><small id="ladderCurrentMeta">資料日收盤</small></li>
            <li class="lad-gap" aria-hidden="true"></li>
            <li class="lad lad-sup" data-key="support1"><span class="lad-name">支撐一</span><b class="num" id="support1">—</b><small id="support1Meta"></small></li>
            <li class="lad-gap" aria-hidden="true"></li>
            <li class="lad lad-sup" data-key="support2"><span class="lad-name">支撐二</span><b class="num" id="support2">—</b><small id="support2Meta"></small></li>
          </ol>
        </aside>
      </section>
      <section class="bd-cat" id="chipsPanel" data-cat-panel="chips" aria-label="籌碼">
        <div id="candidateReasons"></div>
        <div id="bigHolders"></div>
        <p class="bd-cat-empty">這一檔目前不在籌碼選股名單上，也沒有大戶持股資料。</p>
      </section>
      <div class="bd-cat" id="comparePanel" data-cat-panel="compare">
        <section class="bd-compare" id="compareBlock" aria-labelledby="compareTitle" hidden>
          <header class="bd-compare-head">
            <h2 id="compareTitle" class="sr-only">和 0050 對照</h2>
            <p class="bd-compare-date num" id="compareDate"></p>
          </header>
          <p class="bd-compare-status" id="compareStatus" role="status" data-state="loading">讀取對照資料</p>
          <p class="bd-compare-conclusion" id="compareConclusion">讀取中</p>

          <div class="bd-compare-chart-block">
            <div class="bd-compare-chart-head">
              <h3>報酬走勢</h3>
              <div class="bd-compare-legend" id="compareLegend" aria-label="圖例"></div>
            </div>
            <div class="bd-compare-chart" id="compareChart"></div>
            <div class="bd-compare-tooltip" id="compareTooltip" role="status" aria-live="polite" hidden></div>
          </div>

          <!-- 五個期間各一顆鍵（領先 0050 的記號在上、落後的在下），點哪一個看哪一個期間的數字；由個股頁的程式畫 -->
          <div class="bd-compare-periods" id="comparePeriods"></div>
          <!-- 完整的表留給螢幕閱讀器；畫面上看的是上面那一排鍵 -->
          <div class="bd-compare-table-wrap sr-only">
            <table class="bd-compare-table" id="compareTable">
              <caption class="sr-only">配息資料完整時，顯示各期間個股與 0050 的含息報酬、差距及最大回撤</caption>
              <thead><tr><th>股票</th><th>期間</th><th>個股報酬</th><th>0050 報酬</th><th>差距</th><th>個股最大回撤</th><th>0050 最大回撤</th></tr></thead>
              <tbody id="compareTableBody"></tbody>
            </table>
          </div>

          <div class="bd-compare-tools">
            <form class="bd-compare-form" id="compareForm">
              <label for="compareInput">加入比較股票</label>
              <div class="bd-compare-input-row">
                <input id="compareInput" name="compare-code" autocomplete="off" maxlength="24" placeholder="輸入代號或名稱">
                <button id="compareAdd" type="submit">加入</button>
              </div>
            </form>
            <div class="bd-compare-chips" id="compareChips" aria-label="已選股票"></div>
          </div>
        </section>
      </div>
      <!-- 事實區塊（本人 2026-11-15 選擺法 A：K 線圖下面一排切換籤，一次只顯示一塊）。主線掛在價位階梯下面；立體版的價位階梯收進「價位」，
           而本人 2026-11-15 也定了「電腦上三顆分類鍵不用捲就看得到」，所以排在三類之後（合併時助手的暫定，擺法另出樣品請本人選）。
           國外同類股原本緊接在它後面，照舊。 -->
      <section class="sf-blocks" id="stockFactsBlocks" aria-label="事實整理" hidden></section>
      <section class="wp" id="watchPeers" aria-label="國外同類股" hidden></section>
    </main>
  </div>
  <script src="chart-studies.js?v=20261117-m53"></script>
  <script src="chart-drawings.js?v=20261117-m53"></script>
  <script src="drawing-sync.js?v=20261117-m53"></script>
  <script src="kchart.js?v=20261117-m53"></script>
  <script src="intraday.js?v=20261117-m53"></script>
  <script src="stock-signals.js?v=20261117-m53"></script>
  <script src="stock-facts.js?v=20261117-m53"></script>
  <script src="watch-peers.js?v=20261117-m53"></script>
  <script src="scroll-lock.js?v=20261117-m53"></script>
  <script src="watch-judgments.js?v=20261117-m53"></script>
  <script src="holders-weekly.js?v=20261117-m53"></script>
  <script src="holders-card.js?v=20261117-m53"></script>
  <script src="stock-picker.js?v=20261117-n1"></script>
  <script src="stock.js?v=20261117-n1"></script>
  <script src="period-switch.js?v=20261117-m53"></script>
  <script src="chart-menus.js?v=20261117-m53"></script>
  <script src="home-fold.js?v=20261117-m53"></script>
  <script src="desk-tilt.js?v=20261117-m53"></script>
  <script src="watch-push.js?v=20261117-m53"></script>
  <script src="settings.js?v=20261117-m53"></script>
</body>
</html>
